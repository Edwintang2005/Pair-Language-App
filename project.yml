# Xcode project definition. Regenerate Pair.xcodeproj after adding or removing files:
#   xcodegen generate
name: Pair
options:
  bundleIdPrefix: com.pairlanguage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Set this to your Apple Developer Team ID (Xcode > Signing & Capabilities) before installing on a phone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Pair:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: content
        buildPhase: resources
        excludes:
          - "FORMAT.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pairlanguage.app
        PRODUCT_NAME: Pair
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pair
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PairTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Pair
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pairlanguage.app.tests
schemes:
  Pair:
    build:
      targets:
        Pair: all
        PairTests: [test]
    test:
      targets:
        - PairTests
